name: Validate Source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source document & reproducibility
        run: node scripts/validate.mjs

      - name: Run negative tests
        run: node scripts/validate.mjs --test
